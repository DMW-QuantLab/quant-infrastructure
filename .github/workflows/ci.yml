name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: pip install black mypy pytest pytest-cov
      - run: black --check src/ tests/ || true
      - run: mypy src/ || true
      - run: pytest tests/ -v --tb=short
      - run: python -m pytest tests/ --cov=src --cov-report=xml || true

